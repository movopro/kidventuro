<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Kidventuro Adventure Book</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="booklet.css" />
</head>
<body>
  <header class="book-toolbar no-print">
    <a class="toolbar-brand" href="index.html"><span>K</span> Kidventuro</a>
    <div class="toolbar-copy">
      <strong id="toolbarTitle">Adventure book preview</strong>
      <small>25 printable pages • A4</small>
    </div>
    <div class="toolbar-actions">
      <button id="backBtn" class="btn ghost" type="button">← Edit details</button>
      <button id="printBtn" class="btn primary" type="button">Print / Save PDF</button>
    </div>
  </header>

  <main id="book" class="book" aria-live="polite"></main>

  <script src="booklet.js"></script>
</body>
</html>
