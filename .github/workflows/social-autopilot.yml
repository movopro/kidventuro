name: Kidventuro social autopilot

on:
  schedule:
    # Four independent watchdog checks per hour. GitHub scheduled jobs can be delayed
    # or occasionally skipped; the gate still publishes only the earliest due,
    # incomplete local slot, so extra checks cannot create extra scheduled posts.
    - cron: '8 * * * *'
    - cron: '23 * * * *'
    - cron: '38 * * * *'
    - cron: '53 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: Content slot
        required: true
        default: morning
        type: choice
        options:
          - morning
          - evening
      dry_run:
        description: Render a preview without publishing or using paid APIs
        required: true
        default: true
        type: boolean
  push:
    paths:
      - social-autopilot/recovery-trigger.json

permissions:
  contents: write

concurrency:
  group: kidventuro-social-autopilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Kidventuro
        uses: actions/checkout@v4

      - name: Select the local-time slot
        id: gate
        env:
          FORCE_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
          RECOVERY_TRIGGER: ${{ github.event_name == 'push' && 'social-autopilot/recovery-trigger.json' || '' }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: node social-autopilot/src/gate.mjs >> "$GITHUB_OUTPUT"

      - name: Check zero-touch configuration
        if: steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.dry_run == false)
        id: preflight
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: node social-autopilot/src/preflight.mjs >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.gate.outputs.should_run == 'true' && (inputs.dry_run == true || steps.preflight.outputs.configured == 'true')
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore renderer cache
        if: steps.gate.outputs.should_run == 'true' && (inputs.dry_run == true || steps.preflight.outputs.configured == 'true')
        id: renderer-cache
        uses: actions/cache@v4
        with:
          path: social-autopilot/node_modules
          key: ${{ runner.os }}-node22-social-${{ hashFiles('social-autopilot/package.json') }}

      - name: Install renderer
        if: steps.gate.outputs.should_run == 'true' && (inputs.dry_run == true || steps.preflight.outputs.configured == 'true') && steps.renderer-cache.outputs.cache-hit != 'true'
        working-directory: social-autopilot
        run: npm install --no-audit --no-fund

      - name: Verify autopilot
        if: steps.gate.outputs.should_run == 'true' && (inputs.dry_run == true || steps.preflight.outputs.configured == 'true')
        working-directory: social-autopilot
        run: npm test

      - name: Publish automatically
        id: live_publish
        continue-on-error: true
        if: steps.gate.outputs.should_run == 'true' && steps.preflight.outputs.configured == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.dry_run == false)
        env:
          SOCIAL_SLOT: ${{ steps.gate.outputs.slot }}
          SOCIAL_SLOT_KEY: ${{ steps.gate.outputs.slot_key }}
          SOCIAL_POST_VARIANT: ${{ steps.gate.outputs.post_variant }}
          SOCIAL_CONTENT_DATE_OFFSET_DAYS: ${{ steps.gate.outputs.content_date_offset_days }}
          SOCIAL_RESULT_PATH: social-autopilot/status/run-result.json
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PINTEREST_BOARD_NAME: ${{ vars.PINTEREST_BOARD_NAME }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_PINTEREST_CHANNEL_ID: ${{ vars.BUFFER_PINTEREST_CHANNEL_ID }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.BUFFER_TIKTOK_CHANNEL_ID }}
        run: node social-autopilot/src/run.mjs --force --slot "$SOCIAL_SLOT"

      - name: Record live autopilot status
        if: always() && steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.dry_run == false)
        env:
          EVENT_NAME: ${{ github.event_name }}
          SLOT: ${{ steps.gate.outputs.slot }}
          SLOT_KEY: ${{ steps.gate.outputs.slot_key }}
          PREFLIGHT_CONFIGURED: ${{ steps.preflight.outputs.configured }}
          PUBLISH_OUTCOME: ${{ steps.live_publish.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const resultPath = 'social-autopilot/status/run-result.json';
          let details = null;
          if (fs.existsSync(resultPath)) {
            details = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          }
          const status = {
            updatedAt: new Date().toISOString(),
            event: process.env.EVENT_NAME,
            slot: process.env.SLOT || null,
            slotKey: process.env.SLOT_KEY || details?.slotKey || null,
            preflightConfigured: process.env.PREFLIGHT_CONFIGURED || 'false',
            publishOutcome: process.env.PUBLISH_OUTCOME || 'skipped',
            details
          };
          fs.mkdirSync('social-autopilot/status', { recursive: true });
          const body = `${JSON.stringify(status, null, 2)}\n`;
          fs.writeFileSync('social-autopilot/status/latest.json', body);
          if (status.slotKey && status.slotKey !== 'none') {
            fs.writeFileSync(`social-autopilot/status/${status.slotKey}.json`, body);
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-autopilot/status/latest.json
          if [ -n "${SLOT_KEY}" ] && [ "${SLOT_KEY}" != "none" ]; then
            git add "social-autopilot/status/${SLOT_KEY}.json"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record social autopilot status [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify live delivery state
        if: always() && steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.dry_run == false)
        env:
          PREFLIGHT_CONFIGURED: ${{ steps.preflight.outputs.configured }}
          LIVE_PUBLISH_OUTCOME: ${{ steps.live_publish.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const resultPath = 'social-autopilot/status/run-result.json';
          let details = null;
          if (fs.existsSync(resultPath)) details = JSON.parse(fs.readFileSync(resultPath, 'utf8'));

          const preflightOk = process.env.PREFLIGHT_CONFIGURED === 'true';
          const publishOk = process.env.LIVE_PUBLISH_OUTCOME === 'success';
          const outcome = details?.outcome || 'missing';
          const acceptableOutcome = outcome === 'sent' || outcome === 'pending';

          if (!preflightOk || !publishOk || !acceptableOutcome) {
            console.error(`Live delivery unhealthy: preflight=${process.env.PREFLIGHT_CONFIGURED}, publish=${process.env.LIVE_PUBLISH_OUTCOME}, outcome=${outcome}`);
            process.exit(1);
          }

          if (outcome === 'pending') {
            console.log('Delivery accepted by Buffer and still in flight; a later watchdog run will verify final sent state without creating duplicates.');
          } else {
            console.log('All configured platforms are confirmed sent.');
          }
          NODE

      - name: Render manual preview
        if: steps.gate.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          SOCIAL_SLOT: ${{ steps.gate.outputs.slot }}
        run: node social-autopilot/src/run.mjs --force --dry-run --slot "$SOCIAL_SLOT"

      - name: Save preview artifact
        if: steps.gate.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: kidventuro-social-preview-${{ steps.gate.outputs.slot }}
          path: social-autopilot/preview/
          retention-days: 7
