name: Sync supported destination SEO pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-catalog-sync.yml'
      - 'scripts/generate-destination-pages.mjs'
      - 'scripts/generate-supported-destination-pages.mjs'
      - 'scripts/polish-supported-destination-pages.mjs'
      - 'destinations/destination-data.js'
      - 'destinations/guides/**'
      - 'scripts/build-family-guides.mjs'
      - 'robots.txt'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate only paid-product destination pages
        run: npm run generate-seo

      - name: Verify supported SEO output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const robots=fs.readFileSync('robots.txt','utf8');
          const supported=[...robots.matchAll(/^Allow: \/destinations\/([a-z0-9-]+)\.html$/gm)].map(m=>m[1]).filter(slug=>slug!=='index');
          const guides=JSON.parse(fs.readFileSync('destinations/guide-index.json','utf8')).length;
          if(supported.length!==50+guides) throw new Error(`Expected ${50+guides} supported destinations, found ${supported.length}`);
          for(const slug of supported){
            for(const file of [`destinations/${slug}.html`,`es/destinos/${slug}.html`]){
              const html=fs.readFileSync(file,'utf8');
              for(const marker of ['rel="canonical"','application/ld+json','rel="icon"','property="og:image"','name="twitter:image"','<h1>']){
                if(!html.includes(marker)) throw new Error(`${file}: missing ${marker}`);
              }
            }
          }
          const sitemap=fs.readFileSync('sitemap.xml','utf8');
          const urls=(sitemap.match(/<loc>/g)||[]).length;
          if(urls!==107+guides*2+4) throw new Error(`Expected ${107+guides*2+4} sitemap URLs, found ${urls}`);
          console.log('Supported SEO output is consistent.');
          NODE

      - name: Run regression suite
        run: |
          npm --prefix worker install --no-audit --no-fund
          npm --prefix worker test

      - name: Commit generated SEO pages
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml destinations es/destinos
          git commit -m 'Refresh supported destination SEO pages [skip ci]'
          git push origin HEAD:main
