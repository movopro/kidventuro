name: Kidventuro social studio

# Renders queued posts into finished, narrated videos and Pinterest pins,
# uploads them to Cloudinary and records the media in the batch files, so the
# publisher only has to post URLs. Runs when a weekly batch is pushed, or by
# hand. The narrator is Kokoro-82M (Apache-2.0) running on the runner itself:
# no post text is sent to any outside service.

on:
  push:
    branches: [main]
    paths:
      - social-autopilot/content/queue/**
  workflow_dispatch:
    inputs:
      force:
        description: Re-render posts even if their media is current
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: kidventuro-social-studio
  cancel-in-progress: false

env:
  KOKORO_MODEL: ${{ github.workspace }}/.tts/kokoro-v1.0.int8.onnx
  KOKORO_VOICES: ${{ github.workspace }}/.tts/voices-v1.0.bin
  STUDIO_TTS_PYTHON: ${{ github.workspace }}/.tts/venv/bin/python

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Kidventuro
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore renderer cache
        id: renderer-cache
        uses: actions/cache@v4
        with:
          path: social-autopilot/node_modules
          key: ${{ runner.os }}-node22-social-${{ hashFiles('social-autopilot/package.json') }}

      - name: Install renderer
        if: steps.renderer-cache.outputs.cache-hit != 'true'
        working-directory: social-autopilot
        # ci, not install: install rewrote package-lock.json on the runner and
        # the dirty file then blocked the pull that records the media.
        run: npm ci --no-audit --no-fund

      - name: Install the spell checker
        run: sudo apt-get install -y -q hunspell hunspell-en-us >/dev/null

      - name: Restore narrator cache
        id: tts-cache
        uses: actions/cache@v4
        with:
          path: .tts
          key: ${{ runner.os }}-kokoro-onnx-0.4.7-v1.0

      - name: Install the narrator
        if: steps.tts-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv .tts/venv
          .tts/venv/bin/pip install -q kokoro-onnx==0.4.7 soundfile
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSfL -o .tts/kokoro-v1.0.int8.onnx "$base/kokoro-v1.0.int8.onnx"
          curl -sSfL -o .tts/voices-v1.0.bin "$base/voices-v1.0.bin"
          # Pinned: the same files Node 2 verified on 2026-09-29.
          echo "6e742170d309016e5891a994e1ce1559c702a2ccd0075e67ef7157974f6406cb  .tts/kokoro-v1.0.int8.onnx" | sha256sum -c -
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  .tts/voices-v1.0.bin" | sha256sum -c -

      - name: Verify
        working-directory: social-autopilot
        run: npm test

      - name: Render, upload and record
        working-directory: social-autopilot
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          record() {
            # Pushed after every batch, so the nearest week's media is live
            # without waiting for the rest.
            git add content/queue
            git diff --cached --quiet && return 0
            git commit -q -m "Studio: rendered media for $1 [skip ci]"
            for attempt in 1 2 3; do
              if git pull -q --rebase --autostash origin main && git push -q origin HEAD:main; then return 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 15))
            done
            echo "Could not push media records for $1" >&2
            return 1
          }
          today=$(TZ=Europe/Sofia date +%F)
          for batch in content/queue/*.json; do
            if node -e 'const b=require(process.argv[1]); process.exit((b.posts||[]).some(p=>(p.date||"")>=process.argv[2]) ? 0 : 1)' "./$batch" "$today"; then
              echo "== $batch"
              node src/studio/studio.mjs build "$batch" --upload $FORCE
              record "$(basename "$batch")"
            fi
          done

      - name: Keep contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-sheets
          path: |
            social-autopilot/out/studio/*/sheet.jpg
            social-autopilot/out/studio/*/cover.jpg
            social-autopilot/out/studio/*/narration.txt
          retention-days: 14
          if-no-files-found: ignore
