name: Validate Kidventuro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          set -e
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Check launch configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              'package.json','index.html','runtime-config.js','analytics.js','checkout.js','launch-polish.js',
              'success.html','success.js','booklet.html','booklet-session.js',
              'privacy.html','terms.html','refunds.html','CNAME',
              'worker/package.json','worker/wrangler.jsonc','worker/src/index.js','worker/src/ai.js','worker/src/analytics.js',
              'worker/test-webhook.mjs','worker/test-ai.mjs','worker/test-analytics.mjs',
              'test-catalog.mjs','test-checkout-safety.mjs','test-launch.mjs'
          ]
          missing=[p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))

          if Path('CNAME').read_text(encoding='utf-8').strip() != 'kidventuro.com':
              raise SystemExit('Unexpected CNAME')

          root_pkg=json.loads(Path('package.json').read_text(encoding='utf-8'))
          if 'deploy' not in root_pkg.get('scripts',{}) or '--prefix worker' not in root_pkg['scripts']['deploy']:
              raise SystemExit('Root Cloudflare deploy bridge is missing')

          worker_pkg=json.loads(Path('worker/package.json').read_text(encoding='utf-8'))
          test_script=worker_pkg.get('scripts',{}).get('test','')
          for marker in ['test-webhook.mjs','test-ai.mjs','test-analytics.mjs','test-catalog.mjs','test-checkout-safety.mjs','test-launch.mjs']:
              if marker not in test_script:
                  raise SystemExit(f'Worker npm test is missing regression suite: {marker}')

          config=json.loads(Path('worker/wrangler.jsonc').read_text(encoding='utf-8'))
          if config.get('name') != 'kidventuro-api':
              raise SystemExit('Unexpected Worker name')
          if config.get('keep_vars') is not True:
              raise SystemExit('Cloudflare dashboard runtime vars are not preserved')
          if 'LEMONSQUEEZY_WEBHOOK_SECRET' in config.get('secrets',{}).get('required',[]):
              raise SystemExit('Obsolete legacy Lemon Squeezy secret must not block deployment')
          if config.get('vars',{}).get('OPENAI_MODEL') != 'gpt-5.6-luna':
              raise SystemExit('Expected OpenAI model configuration is missing')
          if not any(x.get('binding')=='ENTITLEMENTS' for x in config.get('kv_namespaces',[])):
              raise SystemExit('ENTITLEMENTS KV binding is missing')
          if not any(x.get('binding')=='ANALYTICS' and x.get('dataset')=='kidventuro_funnel' for x in config.get('analytics_engine_datasets',[])):
              raise SystemExit('Kidventuro Analytics Engine binding is missing')

          runtime=Path('runtime-config.js').read_text(encoding='utf-8')
          is_test="checkoutMode:'test'" in runtime
          is_live="checkoutMode:'live'" in runtime
          if is_test == is_live:
              raise SystemExit('Checkout mode must be exactly one of test/live')
          test_ids=[
              'b68dbe91-5c2d-4ede-b9b6-a1e9625627be',
              '002731fe-1735-4287-8223-450d8ef41202',
              'e49470c6-bd0e-4533-a206-c254fa84908f'
          ]
          if is_test and any(cid not in runtime for cid in test_ids):
              raise SystemExit('Test mode must use the known Test checkout URLs')
          if is_live and any(cid in runtime for cid in test_ids):
              raise SystemExit('Live mode must never contain a known Test checkout URL')

          index=Path('index.html').read_text(encoding='utf-8')
          scripts=['runtime-config.js','analytics.js','app.js','checkout.js','launch-polish.js']
          positions=[]
          for script in scripts:
              marker=f'<script src="{script}"></script>'
              pos=index.find(marker)
              if pos < 0:
                  raise SystemExit(f'Landing page is missing script: {script}')
              positions.append(pos)
          if positions != sorted(positions):
              raise SystemExit('Landing scripts are in an unsafe order')

          analytics=Path('analytics.js').read_text(encoding='utf-8')
          for forbidden in ['childName','childAge','kv_ref','order_identifier','email']:
              if forbidden in analytics:
                  raise SystemExit(f'Frontend analytics must not read PII/purchase identifier: {forbidden}')

          privacy=Path('privacy.html').read_text(encoding='utf-8')
          if 'Cloudflare Web Analytics' not in privacy or 'Aggregate analytics' not in privacy:
              raise SystemExit('Privacy notice is not synchronized with analytics flow')

          print('Static launch configuration checks passed')
          PY

      - name: Test signed payments, AI, analytics, catalog and launch flows
        working-directory: worker
        run: npm test

      - name: Validate root-level Cloudflare deployment flow
        run: npm run check-worker
