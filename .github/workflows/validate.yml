name: Validate Kidventuro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in *.js worker/src/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check required launch files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'index.html','styles.css','app.js','checkout.js','success.html','success.js',
              'booklet.html','booklet-v2.js','booklet-session.js',
              'catalog-core.js','catalog-1.js','catalog-2.js','catalog-3.js',
              'age-core.js','age-pages.js','age-final.js','trip-days.js',
              'privacy.html','terms.html','refunds.html','robots.txt','sitemap.xml','CNAME',
              'worker/src/index.js','worker/wrangler.toml','worker/README.md'
          ]
          missing=[p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))
          cname=Path('CNAME').read_text(encoding='utf-8').strip()
          if cname != 'kidventuro.com':
              raise SystemExit(f'Unexpected CNAME: {cname}')
          index=Path('index.html').read_text(encoding='utf-8')
          if 'site-enhance.js' in index or 'booklet.js' in index:
              raise SystemExit('Obsolete script reference found in index.html')
          if 'checkout.js' not in index:
              raise SystemExit('Checkout integration is not loaded by index.html')
          checkout=Path('checkout.js').read_text(encoding='utf-8')
          if '/checkout/buy/' not in checkout or 'checkout[custom][kv_ref]' not in checkout:
              raise SystemExit('Lemon Squeezy checkout integration is incomplete')
          booklet=Path('booklet.html').read_text(encoding='utf-8')
          if 'booklet-session.js' not in booklet or 'booklet-v2.js' not in booklet:
              raise SystemExit('Booklet script chain is incomplete')
          worker=Path('worker/src/index.js').read_text(encoding='utf-8')
          if 'X-Signature' not in worker or 'LEMONSQUEEZY_WEBHOOK_SECRET' not in worker:
              raise SystemExit('Webhook signature verification is incomplete')
          success=Path('success.js').read_text(encoding='utf-8')
          if 'api.kidventuro.com' not in success or 'entitlement/status' not in success:
              raise SystemExit('Success entitlement polling is incomplete')
          print('Static checks passed')
          PY
