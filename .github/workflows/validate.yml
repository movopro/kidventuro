name: Validate Kidventuro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -e
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Check required launch files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              'package.json',
              'index.html','styles.css','app.js','checkout.js','site-expansion.js','runtime-config.js',
              'success.html','success.js','booklet.html','booklet-v2.js','booklet-session.js',
              'mini-mode.js','family-mode.js','ai-mode.js',
              'catalog-core.js','catalog-1.js','catalog-2.js','catalog-3.js','catalog-4.js','catalog-5.js','test-catalog.mjs',
              'age-core.js','age-pages.js','age-final.js','trip-days.js',
              'privacy.html','terms.html','refunds.html','robots.txt','sitemap.xml','CNAME',
              'worker/package.json','worker/wrangler.jsonc','worker/src/index.js','worker/src/ai.js','worker/test-webhook.mjs','worker/test-ai.mjs'
          ]
          missing=[p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))
          cname=Path('CNAME').read_text(encoding='utf-8').strip()
          if cname != 'kidventuro.com':
              raise SystemExit(f'Unexpected CNAME: {cname}')
          if Path('worker/wrangler.toml').exists():
              raise SystemExit('Obsolete worker/wrangler.toml is still present')
          root_pkg=json.loads(Path('package.json').read_text(encoding='utf-8'))
          if 'deploy' not in root_pkg.get('scripts',{}) or '--prefix worker' not in root_pkg['scripts']['deploy']:
              raise SystemExit('Root Cloudflare deploy bridge is missing')
          config=json.loads(Path('worker/wrangler.jsonc').read_text(encoding='utf-8'))
          if config.get('name') != 'kidventuro-api':
              raise SystemExit('Unexpected Worker name')
          if config.get('keep_vars') is not True:
              raise SystemExit('Cloudflare dashboard runtime vars are not preserved')
          required_secrets=config.get('secrets',{}).get('required',[])
          if 'LEMONSQUEEZY_WEBHOOK_SECRET' not in required_secrets:
              raise SystemExit('Lemon Squeezy webhook secret is not declared as required')
          if config.get('vars',{}).get('OPENAI_MODEL') != 'gpt-5.6-luna':
              raise SystemExit('Expected OpenAI model configuration is missing')
          bindings=config.get('kv_namespaces',[])
          if not any(x.get('binding')=='ENTITLEMENTS' for x in bindings):
              raise SystemExit('ENTITLEMENTS KV binding is missing')
          runtime=Path('runtime-config.js').read_text(encoding='utf-8')
          if 'https://kidventuro-api.m-oreshkov.workers.dev' not in runtime:
              raise SystemExit('Frontend API URL is not configured')
          index=Path('index.html').read_text(encoding='utf-8')
          if 'site-enhance.js' in index or 'booklet.js' in index:
              raise SystemExit('Obsolete script reference found in index.html')
          if 'checkout.js' not in index:
              raise SystemExit('Checkout integration is not loaded by index.html')
          checkout=Path('checkout.js').read_text(encoding='utf-8')
          checkout_ids=[
              'b68dbe91-5c2d-4ede-b9b6-a1e9625627be',
              '002731fe-1735-4287-8223-450d8ef41202',
              'e49470c6-bd0e-4533-a206-c254fa84908f'
          ]
          if any(cid not in checkout for cid in checkout_ids):
              raise SystemExit('One or more Lemon Squeezy product checkout URLs are missing')
          for marker in ["checkout[custom][kv_ref]","checkout[custom][product]","product==='family'","children",'site-expansion.js']:
              if marker not in checkout:
                  raise SystemExit(f'Checkout validation marker missing: {marker}')
          booklet=Path('booklet.html').read_text(encoding='utf-8')
          if 'runtime-config.js' not in booklet or 'booklet-session.js' not in booklet:
              raise SystemExit('Booklet payment gate is incomplete')
          if 'booklet-v2.js' in booklet:
              raise SystemExit('Generator must not load before entitlement verification')
          gate=Path('booklet-session.js').read_text(encoding='utf-8')
          for marker in ['mini-mode.js','family-mode.js','status.product','catalog-4.js','catalog-5.js','/ai/enrich','ai-mode.js']:
              if marker not in gate:
                  raise SystemExit(f'Product/AI gate marker missing: {marker}')
          success=Path('success.html').read_text(encoding='utf-8')
          if 'runtime-config.js' not in success or 'success.js' not in success:
              raise SystemExit('Payment success page is incomplete')
          success_js=Path('success.js').read_text(encoding='utf-8')
          if 'personalization.children' not in success_js:
              raise SystemExit('Family recovery is missing from success flow')
          worker=Path('worker/src/index.js').read_text(encoding='utf-8')
          for marker in ['X-Signature','order_created','order_refunded','attrs.status','ENTITLEMENTS','ALLOWED_PRODUCTS','input.children','/ai/enrich','OPENAI_API_KEY']:
              if marker not in worker:
                  raise SystemExit(f'Worker validation marker missing: {marker}')
          privacy=Path('privacy.html').read_text(encoding='utf-8')
          if 'AI-assisted personalization' not in privacy or 'OpenAI' not in privacy:
              raise SystemExit('Privacy notice is not synchronized with AI flow')
          print('Static checks passed')
          PY
      - name: Test signed Lemon Squeezy, AI and catalog flows
        working-directory: worker
        run: npm test
      - name: Validate root-level Cloudflare deployment flow
        run: |
          printf 'LEMONSQUEEZY_WEBHOOK_SECRET=ci-placeholder-not-a-real-secret\n' > worker/.dev.vars
          npm run check-worker
          rm -f worker/.dev.vars
