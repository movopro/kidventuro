name: Submit updated pages to IndexNow

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'assets/**'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Notify IndexNow
        run: node scripts/submit-indexnow.mjs
